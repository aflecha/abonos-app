<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Abonos App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: rgb(175,238,238);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: teal;
            color: white;
            border: none;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .resultado {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
		.btn-eliminar {
		display: inline-block;
		width: auto;
		padding: 3px 8px;
		font-size: 12px;
		background: #800000; /* bordó */
		color: white;
		border: none;
		border-radius: 4px;
		margin-left: 8px;
		cursor: pointer;
		}
		.btn-eliminar:hover {
			background: #a00000;
		}
		.inline-form {
		display: inline;
	}
    </style>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
