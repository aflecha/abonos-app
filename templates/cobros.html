{% extends "base.html" %}

{% block content %}

<div class="card">
    <h3>Registrar cobro</h3>

    <form method="post">
        <label>Cliente:</label>
        <select name="cliente_id">
            {% for c in clientes %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
            {% endfor %}
        </select>

        <label>Fecha:</label>
        <input type="date" name="fecha" required>

        <label>Importe:</label>
        <input type="number" step="0.01" name="importe" required>

        <label>Persona:</label>
        <select name="persona">
            <option>Abel</option>
            <option>Valeria</option>
        </select>

        <button class="btn">Registrar</button>
    </form>
</div>

<div class="card">
    <h3>Listado de cobros</h3>

    {% for p in pagos %}
        <div class="row">
            <span>{{ p[2] }} - {{ p[1] }} - ${{ p[3] }} ({{ p[4] }})</span>

            <form action="/eliminar_pago/{{ p[0] }}" method="get">
                <button class="btn-danger" onclick="return confirm('¿Eliminar pago?')">
                    Eliminar
                </button>
            </form>
        </div>
    {% endfor %}
</div>

{% endblock %}
