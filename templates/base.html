<!DOCTYPE html>
<html lang="es">
<head>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonos App</title>

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            background: #f4f6f7;
        }

        header {
            background: rgb(175,238,238);
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            background: #ffffff;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
		
		.container {
			width: 100%;
			max-width: 900px;
			margin: 0 auto;
			padding: 10px;
		}

		.card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input, select {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn {
            background: rgb(175,238,238);
        }

        .btn-danger {
            background: #8B0000;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
		
		@media (max-width: 768px) {
		.container {
			max-width: 100%;
			padding: 10px;
		}
		
		body {
			font-size: 16px;
			}
		}

    </style>

</head>

<body>

<header>Abonos App</header>

<nav>
    <a href="/">Inicio</a>
    <a href="/clientes">Clientes</a>
    <a href="/gastos">Gastos</a>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
