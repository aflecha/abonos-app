{% extends "base.html" %}

{% block content %}

<div class="card">
    <h3>Registrar gasto</h3>

    <form method="post">
        <label>Descripción:</label>
        <input name="descripcion" required>

        <label>Fecha:</label>
        <input type="date" name="fecha" required>

        <label>Importe:</label>
        <input type="number" step="0.01" name="importe" required>

        <label>Persona:</label>
        <select name="persona">
            <option>Abel</option>
            <option>Valeria</option>
        </select>

        <button class="btn">Agregar</button>
    </form>
</div>

<div class="card">
    <h3>Listado de gastos</h3>

    {% for g in gastos %}
        <div class="row">
            <span>{{ g[2] }} - {{ g[1] }} - ${{ g[3] }} ({{ g[4] }})</span>

            <form action="/eliminar_gasto/{{ g[0] }}" method="get">
                <button class="btn-danger" onclick="return confirm('¿Eliminar gasto?')">
                    Eliminar
                </button>
            </form>
        </div>
    {% endfor %}
</div>

{% endblock %}
