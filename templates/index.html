{% extends "base.html" %}

{% block content %}

<form method="get" class="card">
    <label><b>Mes:</b></label>
    <input type="month" name="mes" value="{{ mes }}">
    <button type="submit">Filtrar</button>
</form>

<h1>Resumen</h1>

<div class="card">
    <p>Abel cobró: ${{ abel_ing }}</p>
    <p>Valeria cobró: ${{ vale_ing }}</p>

    <p>Abel gastos: ${{ abel_gas }}</p>
    <p>Valeria gastos: ${{ vale_gas }}</p>
</div>

<div class="card resultado">
    <p>{{ mensaje }}</p>

    <form action="/saldar" method="get">
        <button class="btn" onclick="return confirm('¿Confirmar que las cuentas están saldadas?')">
            Saldar cuentas
        </button>
    </form>
</div>

<div class="card">
    <a href="/clientes">Clientes</a>
    <a href="/cobros">Cobros</a>
    <a href="/gastos">Gastos</a>
	<a href="/informe">Informe</a>
</div>

{% endblock %}
