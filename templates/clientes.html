{% extends "base.html" %}

{% block content %}

<div class="card">
    <h3>Nuevo cliente</h3>

    <form method="post">
        <input name="nombre" placeholder="Nombre">
        <button class="btn">Agregar</button>
    </form>
</div>

<div class="card">
    <h3>Listado</h3>

    {% for c in clientes %}
        <div class="row">
            <span>{{ c[1] }}</span>

            <form method="post" action="/eliminar_cliente/{{ c[0] }}">
                <button class="btn-danger">Eliminar</button>
            </form>
        </div>
    {% endfor %}
</div>

{% endblock %}
